<!doctype html>
<html lang="ro">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Jurnal terapeutic{% endblock %}</title>
</head>
<body>
    <header>
        <a href="{% url 'accounts:home' %}">Jurnal terapeutic</a>

        <a href="{% url 'accounts:dashboard' %}">Panoul meu</a>
        {% if user.is_authenticated %}
            <form method="post" action="{% url 'accounts:logout' %}" style="display: inline;">
                {% csrf_token %}
                <button type="submit">Deconectare</button>
            </form>
        {% else %}
            <a href="{% url 'accounts:login' %}">Autentificare</a>
        {% endif %}
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
